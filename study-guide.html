<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CKT 1 Study Guide — ZAE Aero Center</title>
  <link rel="stylesheet" href="assets/css/main.css?v=20260924q" />
  <link rel="stylesheet" href="assets/css/quiz.css?v=20260924q" />
  <link rel="stylesheet" href="assets/css/study.css?v=20260924q" />
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>

  <header class="site-header">
    <div class="brand">
      <span class="brand-badge">ZAE</span>
      <div class="brand-text">
        <h1>Aero Center ARTCC</h1>
        <p>En Route Non-Radar &mdash; CKT 1 Study Guide</p>
      </div>
    </div>
    <div class="header-meta">
      <span class="meta-line" id="zulu-clock">--:--:--Z</span>
      <span class="meta-line meta-dim">INITIAL EN ROUTE QUALIFICATION</span>
    </div>
  </header>

  <main class="quiz-main">
    <a class="back-link" href="study.html">&larr; Back to Study Guides</a>
    <h2 class="page-title">CKT 1 Study Guide</h2>
    <div class="sg-tabs" role="tablist">
      <button type="button" class="tab tab-active" data-panel="guide">Study Guide</button>
      <button type="button" class="tab" data-panel="quiz">CKT 1 Quiz</button>
    </div>
    <div id="guide" class="sg-panel"></div>
    <div id="quiz" class="sg-panel" hidden></div>
  </main>

  <footer class="site-footer">
    <span>Aero Center (ZAE) &middot; CKT 1 Study Guide &middot; Course 50148001</span>
    <span class="meta-dim">Training use only</span>
  </footer>

  <script src="assets/js/main.js?v=20260924q"></script>
  <script src="assets/data/quiz.js?v=20260924q"></script>
  <script src="assets/js/study-guide.js?v=20260924q"></script>
  <script src="assets/js/quiz.js?v=20260924q"></script>
  <script>
    (function () {
      var tabs = document.querySelectorAll(".sg-tabs .tab");
      tabs.forEach(function (t) {
        t.addEventListener("click", function () {
          tabs.forEach(function (o) { o.classList.toggle("tab-active", o === t); });
          document.querySelectorAll(".sg-panel").forEach(function (p) { p.hidden = p.id !== t.dataset.panel; });
        });
      });
    })();
  </script>
</body>
</html>
